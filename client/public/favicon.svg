  viewBox="0 0 64 64"
  role="img"
  aria-label="Espaço Therapy"
>
  <rect width="64" height="64" rx="12" fill="#302b27" />
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c97a" />
      <stop offset="50%" stop-color="#d4a84b" />
      <stop offset="100%" stop-color="#b58a3a" />
    </linearGradient>
  </defs>
  <g fill="url(#g)" opacity="0.95">
    <!-- Pétala central -->
    <ellipse cx="32" cy="28" rx="5.5" ry="14" />
    <!-- Pétalas laterais internas -->
    <ellipse cx="32" cy="30" rx="5" ry="12" transform="rotate(-28 32 30)" />
